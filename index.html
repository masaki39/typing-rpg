<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>呪文詠唱タイピングRPG</title>
  <meta name="description" content="呪文をローマ字で詠唱して戦う、ボス戦特化のタイピングRPG。ボスの詠唱を読み、壁・中断・浄化を唱え分けて4体の魔物を討伐せよ。ブラウザですぐ遊べます。">
  <meta name="theme-color" content="#0d111c">
  <meta property="og:type" content="website">
  <meta property="og:title" content="呪文詠唱タイピングRPG">
  <meta property="og:description" content="呪文をローマ字で詠唱して戦う、ボス戦特化のタイピングRPG。ボスの詠唱を読み、唱え分けて生き残れ。">
  <meta property="og:image" content="https://masaki39.net/typing-rpg/og.png">
  <meta property="og:url" content="https://masaki39.net/typing-rpg/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- Web フォント (オフラインでも style.css のフォールバックで崩れない) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="sprites.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">✦</span>
        <h1>呪文詠唱タイピングRPG</h1>
      </div>
      <div class="topbar-right">
        <span id="diff-label" class="chip"></span>
        <span id="stage-label" class="stage-label num"></span>
        <button id="sound-toggle" class="icon-btn" type="button" title="ミュートの切り替え" aria-label="ミュートの切り替え">🔊</button>
        <button id="pause-btn" class="icon-btn" type="button" title="一時停止 (Esc)" aria-label="一時停止">❚❚</button>
      </div>
    </header>

    <main class="stage-grid">
      <section class="panel boss" id="enemy-area">
        <div class="boss-plate">
          <div class="boss-title">
            <span id="enemy-name" class="boss-name"></span>
            <span id="enemy-phase" class="phase-chip"></span>
          </div>
          <div class="enrage" id="enrage" title="時間切れ (全滅技) まで">
            <span class="enrage-label">ENRAGE</span>
            <span id="enrage-time" class="enrage-time num">0:00</span>
          </div>
        </div>
        <div class="gauge-track boss-hp">
          <div id="enemy-hp-lag" class="gauge-lag"></div>
          <div id="enemy-hp-fill" class="gauge-fill"></div>
          <span id="enemy-hp-text" class="gauge-text num"></span>
        </div>
        <div class="boss-body">
          <div class="boss-aura"></div>
          <div id="enemy-sprite" class="sprite" role="img"></div>
          <div id="enemy-fx" class="fx-layer"></div>
        </div>
        <div id="boss-cast" class="castbar">
          <div class="castbar-head">
            <span id="cast-type" class="cast-type"></span>
            <span id="cast-name" class="cast-name"></span>
            <span id="cast-time" class="cast-time num"></span>
          </div>
          <div class="castbar-track"><div id="cast-fill" class="castbar-fill"></div></div>
          <div id="cast-hint" class="cast-hint"></div>
        </div>
      </section>

      <aside class="side">
        <section class="panel timeline-panel">
          <h2 class="panel-title">Timeline<span id="tl-hidden" class="tl-hidden" title="Hard 以上は次の技が表示されません。一時停止中や敗北時に敵のタイムラインを確認できます" hidden>次の技は非表示</span></h2>
          <ol id="timeline-list" class="tl-list"></ol>
        </section>
        <section class="panel stats-panel">
          <dl class="stat-grid">
            <div><dt>COMBO</dt><dd id="stat-combo" class="num">0</dd></div>
            <div><dt>打/秒</dt><dd id="stat-speed" class="num">0.0</dd></div>
            <div><dt>ACC</dt><dd id="stat-acc" class="num">-</dd></div>
            <div><dt>中断</dt><dd id="stat-int" class="num">0</dd></div>
          </dl>
        </section>
        <section class="panel log-panel">
          <ul id="log" class="log"></ul>
        </section>
      </aside>
    </main>

    <section class="party" id="player-area">
      <div class="party-gauges">
        <div class="gauge hp">
          <span class="gauge-label">HP</span>
          <div class="gauge-track"><div id="player-hp-lag" class="gauge-lag"></div><div id="player-hp-fill" class="gauge-fill"></div></div>
          <span id="player-hp-text" class="gauge-num num"></span>
        </div>
        <div class="gauge mp">
          <span class="gauge-label">MP</span>
          <div class="gauge-track"><div id="player-mp-fill" class="gauge-fill"></div></div>
          <span id="player-mp-text" class="gauge-num num"></span>
        </div>
      </div>
      <div class="status-row" id="status-row">
        <span class="status buff" data-status="barrier"><i>◆</i>壁 <span class="num"></span></span>
        <span class="status buff" data-status="regen"><i>✚</i>再生 <span class="num"></span></span>
        <span class="status buff" data-status="empower"><i>▲</i>漲り</span>
        <span class="status buff" data-status="ward"><i>❖</i>加護 <span class="num"></span></span>
        <span class="status buff" data-status="silenceReady"><i>✕</i>構え <span class="num"></span></span>
        <span class="status debuff" data-status="dot"><i>☠</i><span class="label"></span> <span class="num"></span></span>
        <span class="status debuff" data-status="vuln"><i>!</i><span class="label"></span> <span class="num"></span></span>
      </div>
      <div id="player-fx" class="fx-layer"></div>
    </section>

    <!-- 詠唱ライン: 入力中の呪文を大きく表示する (視認性最優先) -->
    <section class="chant" id="chant">
      <div class="chant-meta">
        <span id="chant-name" class="chant-name"></span>
        <span id="chant-candidates" class="chant-candidates"></span>
      </div>
      <div class="chant-romaji num"><span id="chant-typed" class="typed"></span><span id="chant-rest" class="rest"></span></div>
      <div id="chant-kana" class="chant-kana"></div>
    </section>

    <section id="hand" class="hand">
      <div class="attack-line">
        <div id="attack-row" class="attack-row"></div>
        <button id="redraw-tile" class="redraw-tile" type="button" title="攻撃呪文3枠を引き直す">
          <span class="redraw-icon">↻</span>
          <span class="redraw-label">引き直し</span>
          <kbd>Space</kbd>
          <span id="redraw-cost" class="redraw-cost num"></span>
          <span class="cd-veil"><span id="redraw-cd" class="cd-text num"></span></span>
        </button>
      </div>
      <div id="skill-row" class="hotbar"></div>
    </section>

    <p class="help">打ち始めた文字で呪文が決まる ／ <kbd>Backspace</kbd> 詠唱を破棄 ／ <kbd>Space</kbd> 攻撃呪文を引き直し ／ <kbd>Esc</kbd> 一時停止 ／ 入力は<strong>半角英数（IMEオフ）</strong></p>

    <!-- ステージ開始の演出 -->
    <div id="banner" class="banner" aria-live="polite">
      <div class="banner-inner">
        <span id="banner-stage" class="banner-stage"></span>
        <span id="banner-name" class="banner-name"></span>
        <span id="banner-call" class="banner-call"></span>
      </div>
    </div>
  </div>

  <p id="ime-warning" class="ime-warning" role="alert">IMEがオンになっています。半角英数入力に切り替えてください。</p>

  <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-hidden="false">
    <div id="overlay-content" class="overlay-panel"></div>
  </div>

  <noscript><p class="noscript">このゲームを遊ぶには JavaScript を有効にしてください。</p></noscript>

  <script src="js/romaji.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
